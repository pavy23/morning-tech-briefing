# TEMPORARY diagnostic: renders the new fallback link (Google Search News tab) in headless Chromium. Removed right after.
name: diag fallback links (temporary)
on:
  push:
    branches: [claude/lucid-babbage-xtsh4h]
    paths: [".github/workflows/diag-fallback-links.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render Google Search News-tab links
        shell: bash
        run: |
          mkdir -p probe && cd probe
          npm init -y >/dev/null
          npm i -s playwright@1.48.2 >/dev/null
          npx -y playwright@1.48.2 install chromium >/dev/null
          cat > probe.mjs <<'EOF'
          import { chromium, devices } from "playwright";
          const QUERIES = ["Anthropic 100 million enterprise AI talent engineers Claude", "Tesla Optimus Giga Texas"];
          const link = (q) => `https://www.google.com/search?q=${encodeURIComponent(q)}&tbm=nws&hl=ko`;
          const browser = await chromium.launch();
          for (const [name, dev] of [["Android (Pixel 7)", devices["Pixel 7"]], ["iPhone 14 UA", devices["iPhone 14"]], ["PC Chrome", devices["Desktop Chrome"]]]) {
            const { defaultBrowserType, ...opts } = dev;
            const ctx = await browser.newContext({ ...opts, locale: "ko-KR" });
            const page = await ctx.newPage();
            for (const q of QUERIES) {
              try {
                await page.goto(link(q), { waitUntil: "domcontentloaded", timeout: 25000 });
                await page.waitForTimeout(3000);
                const info = await page.evaluate(() => {
                  const hrefs = [...document.querySelectorAll("a[href]")].map((a) => a.href).filter((h) => /^https?:/.test(h));
                  const ext = hrefs.filter((h) => !/(^|\.)google\.|gstatic\.|googleusercontent\.|accounts\.google|support\.google|policies\.google/.test(new URL(h).hostname));
                  const heads = [...document.querySelectorAll('div[role="heading"], h3')].map((e) => e.textContent.trim()).filter((t) => t.length > 15).slice(0, 4);
                  return { url: location.href, hosts: [...new Set(ext.map((h) => new URL(h).hostname.replace(/^www\./, "")))], heads, text: document.body.innerText.replace(/\s+/g, " ").slice(0, 160) };
                });
                console.log(`\n[${name}] ${q}`);
                console.log(`  주소: ${info.url.slice(0, 90)}`);
                console.log(`  외부 기사 도메인 ${info.hosts.length}개: ${info.hosts.slice(0, 8).join(", ")}`);
                for (const h of info.heads) console.log(`  - ${h.slice(0, 90)}`);
                if (info.hosts.length === 0) console.log(`  본문 앞부분: ${info.text}`);
              } catch (e) {
                console.log(`\n[${name}] ${q}\n  ERR ${e.message.split("\n")[0]}`);
              }
            }
            await ctx.close();
          }
          await browser.close();
          EOF
          node probe.mjs
