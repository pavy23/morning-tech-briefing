# TEMPORARY diagnostic — removed right after it runs.
# Checks what the email's "search fallback" link (Google News search) returns,
# on desktop and mobile user agents, and which paths the Google News apps claim.
name: diag fallback links (temporary)

on:
  push:
    branches: [claude/lucid-babbage-xtsh4h]
    paths: [".github/workflows/diag-fallback-links.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe fallback link targets
        shell: bash
        run: |
          cat > diag.mjs <<'EOF'
          // 2차: 앱 링크 선언 파일 전체 확인 (1차는 출력 길이 제한으로 잘림)
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36";
          async function get(u) {
            const r = await fetch(u, { headers: { "User-Agent": UA }, signal: AbortSignal.timeout(15000) });
            return { status: r.status, text: await r.text() };
          }
          const a = await get("https://news.google.com/.well-known/assetlinks.json");
          console.log(`assetlinks.json -> ${a.status}`);
          try {
            for (const s of JSON.parse(a.text)) console.log(`  android: ${s.target?.package_name} | ${s.relation?.join(",")}`);
          } catch { console.log(a.text.slice(0, 1500)); }
          for (const u of ["https://news.google.com/.well-known/apple-app-site-association", "https://news.google.com/apple-app-site-association"]) {
            const r = await get(u);
            console.log(`\n${u} -> ${r.status} (${r.text.length} bytes)`);
            try {
              const j = JSON.parse(r.text);
              for (const d of j.applinks?.details || []) {
                const paths = d.paths || (d.components || []).map((c) => (c.exclude ? "NOT " : "") + (c["/"] || ""));
                const ids = d.appID || (d.appIDs || []).join(",");
                console.log(`  ios: ${ids} | /search 포함=${paths.includes("/search")} | paths=${paths.join(" ")}`);
              }
            } catch (e) { console.log("parse error", e.message, r.text.slice(-400)); }
          }
          EOF
          node diag.mjs
