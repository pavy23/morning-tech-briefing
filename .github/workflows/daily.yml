name: Daily Morning Tech Briefing

on:
  schedule:
    # 매일 23:00 UTC = 다음날 08:00 KST (KST = UTC+9)
    - cron: "0 23 * * *"
  # 수동 실행 버튼 (테스트용)
  workflow_dispatch:
    inputs:
      skip_email:
        description: "메일을 보내지 않고 수집·섀도 판정 로그만 확인"
        type: boolean
        default: false
      model:
        description: "이번 실행에서만 쓸 Gemini 모델 (비우면 Variables의 MODEL). 모델 교체 전 테스트용"
        type: string
        default: ""
      debug:
        description: "Gemini 응답 구조를 로그에 남기고 가드를 끈 채 1회만 수집 (진단용)"
        type: boolean
        default: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    # 시도마다 링크 검증(최대 ~16초)이 붙고, 최대 6회 재시도 + 백오프(일시 오류 시 20·40초)까지 감안
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 전날까지의 브리핑 헤드라인 이력 (.briefing-state/)을 캐시로 이어 받는다.
      # restore-keys의 접두사 매칭은 "가장 최근에 저장된" 캐시를 고르므로 매일 굴러간다.
      - name: Restore briefing history
        uses: actions/cache/restore@v4
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}
          restore-keys: |
            briefing-state-

      - name: Send daily briefing email
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          MODEL: ${{ inputs.model || vars.MODEL }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          MIN_GROUNDED_LINKS: ${{ inputs.debug == true && '0' || vars.MIN_GROUNDED_LINKS }}
          DEBUG_GEMINI_RESPONSE: ${{ inputs.debug == true && '1' || '' }}
          # Jev 선별 모드 (기본 켜짐). Variables에 JEV_SELECT=shadow 를 두면 기록만 하고 메일은 그대로
          JEV_SELECT: ${{ vars.JEV_SELECT }}
          SKIP_EMAIL: ${{ inputs.skip_email == true && '1' || '' }}
        run: node src/index.mjs

      # skip_email 실행은 이력을 갱신하지 않으므로 저장할 것이 없다 (경고 방지)
      - name: Save briefing history
        if: always() && inputs.skip_email != true
        uses: actions/cache/save@v4
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}

      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-report-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
