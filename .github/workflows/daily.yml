name: Daily Morning Tech Briefing

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦게 시작한다(05:23 예약이 2026-10-27~11-02에 3.1~3.7시간, 11-03에 6.1시간 늦음.
    # 08-24~26처럼 아예 누락되는 날도 있음). 그래서 00:23~07:23 KST에 한 시간마다 걸어 두고, 먼저 시작한 실행이
    # 발송 시각(기본 07:50 KST)까지 기다렸다가 보낸다(아래 gate 작업). 정각은 부하가 몰려 23분. (KST = UTC+9)
    - cron: "23 15 * * *" # 00:23 KST
    - cron: "23 16 * * *" # 01:23 KST
    - cron: "23 17 * * *" # 02:23 KST
    - cron: "23 18 * * *" # 03:23 KST
    - cron: "23 19 * * *" # 04:23 KST
    - cron: "23 20 * * *" # 05:23 KST
    - cron: "23 21 * * *" # 06:23 KST
    - cron: "23 22 * * *" # 07:23 KST
  # 수동 실행 버튼 (테스트용)
  workflow_dispatch:
    inputs:
      skip_email:
        description: "메일을 보내지 않고 수집·섀도 판정 로그만 확인"
        type: boolean
        default: false
      model:
        description: "이번 실행에서만 쓸 모델 (claude-sonnet-5-5, claude-haiku-5-5, gemini-3.6-flash 등. 비우면 Variables의 MODEL)"
        type: string
        default: ""
      debug:
        description: "가드를 끈 채 1회만 수집하고 Gemini 응답 구조를 로그에 남김 (진단용)"
        type: boolean
        default: false

# 예약 실행과 수동 실행이 겹치면 차례로 돈다. 뒤에 도는 실행은 앞 실행이 저장한 이력을 보고
# 오늘 이미 보냈는지 판단하므로 동시에 돌면 안 된다. 발송 시각을 기다리는 실행도 이 그룹을 쥐고 있어서,
# 그동안 시작한 예약 실행은 기다렸다가 "이미 발송됨"으로 끝난다 (대기 중인 실행은 가장 최근 하나만 남고 나머지는 취소됨).
concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  # 예약 실행은 발송 시각(Variables의 SEND_AT, 기본 07:50 KST)까지 기다렸다가 다음 작업으로 넘긴다.
  # 그보다 MAX_WAIT_MIN분 넘게 일찍 시작했으면 바로 끝내고 다음 예약에 맡기고, 발송 시각이 지나 시작했으면
  # 기다리지 않는다. 수동 실행은 항상 바로 진행한다. timeout-minutes는 MAX_WAIT_MIN보다 커야 한다.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    outputs:
      proceed: ${{ steps.wait.outputs.proceed }}
      started_at: ${{ steps.wait.outputs.started_at }}
    steps:
      - name: Wait for the send time
        id: wait
        env:
          SEND_AT: ${{ vars.SEND_AT || '07:50' }}
          MAX_WAIT_MIN: 180
        run: |
          started=$(date +%s)
          echo "started_at=$(date -u -d "@$started" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(TZ=Asia/Seoul date -d "@$started" +%F)
          if ! target=$(TZ=Asia/Seoul date -d "$today $SEND_AT" +%s 2>/dev/null); then
            echo "::warning title=SEND_AT 형식 오류::'$SEND_AT'을 읽지 못해 기다리지 않고 진행합니다 (KST, HH:MM)"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wait=$(( target - started ))
          if [ "$wait" -gt $(( MAX_WAIT_MIN * 60 )) ]; then
            echo "발송 시각 $SEND_AT KST까지 $(( wait / 60 ))분 남음 → 대기 상한 ${MAX_WAIT_MIN}분을 넘어 다음 예약에 맡깁니다"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          elif [ "$wait" -gt 0 ]; then
            echo "발송 시각 $SEND_AT KST까지 $(( (wait + 59) / 60 ))분 기다립니다"
            sleep "$wait"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "발송 시각 $SEND_AT KST가 지나 바로 진행합니다"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  send-briefing:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Claude 웹 검색 수집은 1회 1~2.5분. 최대 6회 재시도 + 백오프(일시 오류 시 20~60초)와 링크 검증까지 감안
    timeout-minutes: 25
    env:
      # 1Password 서비스 계정 토큰이 등록돼 있을 때만 아래 "Load API keys from 1Password" 단계를 돌린다
      USE_1PASSWORD: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 전날까지의 브리핑 헤드라인 이력 (.briefing-state/)을 캐시로 이어 받는다.
      # restore-keys의 접두사 매칭은 "가장 최근에 저장된" 캐시를 고르므로 매일 굴러간다.
      # 복원은 다운로드가 실패해도 경고만 남기고 "캐시 없음"으로 넘어간다(2026-10-31: "Egress is over the
      # account limit"로 같은 날 두 번 발송). 그래서 먼저 내려받지 않고 있는지만 확인해 두고, 둘을 비교해 실패를 가려낸다.
      - name: Look up briefing history
        id: state-lookup
        uses: actions/cache/restore@v6
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}
          restore-keys: |
            briefing-state-
          lookup-only: true

      - name: Restore briefing history
        id: state
        uses: actions/cache/restore@v6
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}
          restore-keys: |
            briefing-state-

      # Secrets에 키 대신 1Password 비밀 참조(op://볼트/항목/필드)를 넣어 두면 여기서 실제 키로 바꾼다.
      # 참조가 아닌 값(기존 키)은 건드리지 않으므로 Secrets를 하나씩 옮겨도 발송이 끊기지 않는다.
      # 참조를 하나라도 못 읽으면 이 단계에서 실패한다. 키를 다루는 외부 Action이라 커밋 SHA로 고정.
      - name: Load API keys from 1Password
        id: op
        if: env.USE_1PASSWORD == 'true'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false # 키는 이 단계의 출력(steps.op.outputs.*)으로만 넘긴다
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

      - name: Send daily briefing email
        env:
          # API 키 4개는 1Password에서 읽은 값이 있으면 그 값, 없으면 Secrets 값을 그대로 쓴다
          # Claude (MODEL이 claude-*일 때). 워크스페이스 전용 키면 ANTHROPIC_WORKSPACE_ID는 비워 둔다
          ANTHROPIC_API_KEY: ${{ steps.op.outputs.ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          NEWS_EFFORT: ${{ vars.NEWS_EFFORT }}
          NEWS_MAX_SEARCHES: ${{ vars.NEWS_MAX_SEARCHES }}
          NEWS_TOPUP_SEARCHES: ${{ vars.NEWS_TOPUP_SEARCHES }}
          # Gemini (기본 모델이 Gemini이거나, Claude 장애 시 백업)
          GEMINI_API_KEY: ${{ steps.op.outputs.GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ steps.op.outputs.RESEND_API_KEY || secrets.RESEND_API_KEY }}
          TYPESAFE_API_KEY: ${{ steps.op.outputs.TYPESAFE_API_KEY || secrets.TYPESAFE_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          MODEL: ${{ inputs.model || vars.MODEL }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          MIN_GROUNDED_LINKS: ${{ inputs.debug == true && '0' || vars.MIN_GROUNDED_LINKS }}
          DEBUG_GEMINI_RESPONSE: ${{ inputs.debug == true && '1' || '' }}
          # Jev 선별 모드 (기본 켜짐). Variables에 JEV_SELECT=shadow 를 두면 기록만 하고 메일은 그대로
          JEV_SELECT: ${{ vars.JEV_SELECT }}
          # 재탕 제거 기준 확률 (비우면 0.6, src/judge.mjs)
          REPEAT_THRESHOLD: ${{ vars.REPEAT_THRESHOLD }}
          SKIP_EMAIL: ${{ inputs.skip_email == true && '1' || '' }}
          # 월 환산 API 비용이 이 금액(USD)을 넘으면 메일·로그에 경고 (기본 50)
          COST_ALERT_USD: ${{ vars.COST_ALERT_USD }}
          # 어느 예약(cron)으로 시작했는지 → 예정 대비 지연 시간 기록
          SCHEDULE_CRON: ${{ github.event.schedule }}
          # gate 작업이 시작한 시각. 발송 시각까지 기다린 시간을 빼고 GitHub의 실제 지연만 계산한다
          SCHEDULE_STARTED_AT: ${{ needs.gate.outputs.started_at }}
          # 이력 캐시가 있는데 내려받지 못했으면 "1" → 예약 실행은 같은 날 중복 발송을 막으려 건너뛴다
          STATE_RESTORE_FAILED: ${{ steps.state-lookup.outputs.cache-matched-key != '' && steps.state.outputs.cache-matched-key == '' && '1' || '' }}
        run: node src/index.mjs

      # 이력(history.json)과 비용 원장(costs.json)을 함께 저장한다.
      # skip_email 테스트도 API 비용은 들므로 저장한다 (이력은 갱신하지 않음).
      # 이력을 내려받지 못한 실행은 저장하지 않는다. 빈 이력이 "가장 최근 캐시"가 되면 다음 실행들이 그걸 이어 받는다.
      - name: Save briefing history
        if: always() && (steps.state.outputs.cache-matched-key != '' || steps.state-lookup.outputs.cache-matched-key == '')
        uses: actions/cache/save@v6
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}

      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadow-report-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
