name: Daily Morning Tech Briefing

on:
  schedule:
    # GitHub 예약 실행은 정각에 몰려 늦어진다(2026-09-01~10-08: 08:00 예약이 1.8~3.9시간 늦은 09:47~11:51에 시작, 08-24~26은 누락).
    # 정각을 피한 23분에 네 번 걸어 두고, 먼저 시작한 실행이 보내면 나머지는 API 호출 없이 바로 끝난다.
    # 앞의 예약이 3시간 넘게 밀려도 09:00 전에 도착하도록 05:23 KST부터 시작한다. (KST = UTC+9)
    - cron: "23 20 * * *" # 05:23 KST
    - cron: "23 21 * * *" # 06:23 KST
    - cron: "23 22 * * *" # 07:23 KST
    - cron: "23 23 * * *" # 08:23 KST
  # 수동 실행 버튼 (테스트용)
  workflow_dispatch:
    inputs:
      skip_email:
        description: "메일을 보내지 않고 수집·섀도 판정 로그만 확인"
        type: boolean
        default: false
      model:
        description: "이번 실행에서만 쓸 모델 (claude-sonnet-5-5, claude-haiku-5-5, gemini-3.6-flash 등. 비우면 Variables의 MODEL)"
        type: string
        default: ""
      debug:
        description: "가드를 끈 채 1회만 수집하고 Gemini 응답 구조를 로그에 남김 (진단용)"
        type: boolean
        default: false

# 예약 실행과 수동 실행이 겹치면 차례로 돈다. 뒤에 도는 실행은 앞 실행이 저장한 이력을 보고
# 오늘 이미 보냈는지 판단하므로 동시에 돌면 안 된다.
concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    # Claude 웹 검색 수집은 1회 1~2.5분. 최대 6회 재시도 + 백오프(일시 오류 시 20~60초)와 링크 검증까지 감안
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 전날까지의 브리핑 헤드라인 이력 (.briefing-state/)을 캐시로 이어 받는다.
      # restore-keys의 접두사 매칭은 "가장 최근에 저장된" 캐시를 고르므로 매일 굴러간다.
      - name: Restore briefing history
        uses: actions/cache/restore@v4
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}
          restore-keys: |
            briefing-state-

      - name: Send daily briefing email
        env:
          # Claude (MODEL이 claude-*일 때). 워크스페이스 전용 키면 ANTHROPIC_WORKSPACE_ID는 비워 둔다
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          NEWS_EFFORT: ${{ vars.NEWS_EFFORT }}
          NEWS_MAX_SEARCHES: ${{ vars.NEWS_MAX_SEARCHES }}
          # Gemini (기본 모델이 Gemini이거나, Claude 장애 시 백업)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          READER_PROFILE: ${{ secrets.READER_PROFILE }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          MODEL: ${{ inputs.model || vars.MODEL }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          MIN_GROUNDED_LINKS: ${{ inputs.debug == true && '0' || vars.MIN_GROUNDED_LINKS }}
          DEBUG_GEMINI_RESPONSE: ${{ inputs.debug == true && '1' || '' }}
          # Jev 선별 모드 (기본 켜짐). Variables에 JEV_SELECT=shadow 를 두면 기록만 하고 메일은 그대로
          JEV_SELECT: ${{ vars.JEV_SELECT }}
          SKIP_EMAIL: ${{ inputs.skip_email == true && '1' || '' }}
          # 월 환산 API 비용이 이 금액(USD)을 넘으면 메일·로그에 경고 (기본 50)
          COST_ALERT_USD: ${{ vars.COST_ALERT_USD }}
          # 어느 예약(cron)으로 시작했는지 → 예정 대비 지연 시간 기록
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node src/index.mjs

      # 이력(history.json)과 비용 원장(costs.json)을 함께 저장한다.
      # skip_email 테스트도 API 비용은 들므로 저장한다 (이력은 갱신하지 않음).
      - name: Save briefing history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .briefing-state
          key: briefing-state-${{ github.run_id }}

      - name: Upload shadow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-report-${{ github.run_id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
